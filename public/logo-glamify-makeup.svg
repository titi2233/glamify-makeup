<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Nunito+Sans:wght@700&amp;display=swap');
      .title {
        font-family: 'Playfair Display', Georgia, serif;
        font-weight: 700;
        font-size: 46px;
        letter-spacing: 0.18em;
        fill: #111111;
      }
      .subtitle {
        font-family: 'Nunito Sans', system-ui, sans-serif;
        font-weight: 700;
        font-size: 13px;
        letter-spacing: 0.42em;
        fill: #E6007A;
      }
      .sparkle {
        fill: #E6007A;
      }
    </style>
  </defs>

  <g transform="translate(200, 60)" text-anchor="middle">
    <!-- GLAMIFY TEXT -->
    <text x="0" y="0" class="title">GLAMIFY</text>
    
    <!-- SPARKLE STAR ABOVE Y (at x ≈ 138, y ≈ -36) -->
    <path d="M 138 -48 Q 138 -36 150 -36 Q 138 -36 138 -24 Q 138 -36 126 -36 Q 138 -36 138 -48 Z" class="sparkle" />
    
    <!-- MAKEUP SUBTITLE -->
    <text x="0" y="28" class="subtitle">MAKEUP</text>
  </g>
</svg>
