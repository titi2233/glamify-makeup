<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="glamGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF2E93" />
      <stop offset="50%" stop-color="#E6007A" />
      <stop offset="100%" stop-color="#C20067" />
    </linearGradient>
    <radialGradient id="sparkleGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#FF2E93" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#E6007A" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Fondo oscuro de lujo -->
  <rect width="512" height="512" rx="112" fill="#161413" />

  <!-- Borde ultra fino -->
  <rect width="504" height="504" x="4" y="4" rx="108" fill="none" stroke="#E6007A" stroke-width="6" stroke-opacity="0.4" />

  <!-- Letra G editorial serif con peso y presencia -->
  <text x="215" y="365" font-family="'Playfair Display', 'Times New Roman', Georgia, serif" font-size="310" font-weight="700" fill="#FFFFFF" text-anchor="middle">G</text>

  <!-- Destello estrella de 4 puntas de Glamify Makeup -->
  <path d="M 390 100 Q 390 165 455 165 Q 390 165 390 230 Q 390 165 325 165 Q 390 165 390 100 Z" fill="url(#glamGradient)" />
  
  <!-- Núcleo central del destello -->
  <circle cx="390" cy="165" r="14" fill="#FFFFFF" opacity="0.95" />
</svg>
